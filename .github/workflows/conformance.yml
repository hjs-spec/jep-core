name: JEP Core conformance (0.7 current + 0.6 legacy)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/check_repository.py
      - run: python -m pytest
      - name: Run current JEP 0.7 suite
        run: python reference-validator/jep_validate_07.py run-tests test-manifest-0.7.json
      - name: Run legacy JEP 0.6 suite
        run: python reference-validator/jep_validate.py run-tests test-manifest-0.6.json
      - name: Validate current schemas
        run: |
          python -m json.tool schemas/jep-event.schema.json >/dev/null
          python -m json.tool schemas/jep-ref.schema.json >/dev/null
          python -m json.tool schemas/jep-profile.schema.json >/dev/null
          python -m json.tool schemas/jep-validation-result.schema.json >/dev/null

  typescript:
    name: Legacy 0.6 TypeScript / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - working-directory: typescript-validator
        run: npm ci
      - working-directory: typescript-validator
        run: npm run check

  go:
    name: Legacy 0.6 Go conformance verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go-validator/go.mod
      - working-directory: go-validator
        run: go test -race ./...

  legacy-interop:
    name: Legacy 0.6 cross-language interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e '.[test]'
      - run: npm ci && npm run build
        working-directory: typescript-validator
      - run: python -m pytest tests/test_replay_concurrency.py tests/test_replay_context.py
