name: Verify frozen IETF JEP-07 publication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releases/draft-07/**
      - ietf-rendered/draft-wang-jep-judgment-event-protocol-07.*
      - draft-wang-jep-judgment-event-protocol-07.md
      - scripts/check_repository.py
      - .github/workflows/ietf-jep07.yml

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - uses: actions/upload-artifact@v4
        with:
          name: jep-07-frozen-publication
          path: releases/draft-07/
