name: Publish versioned release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine pytest-asyncio httpx -e '.[test]'
      - run: python scripts/check_repository.py
      - run: python -m pytest tests -q
      - run: python -m build && twine check dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -race -count=1 ./...
        working-directory: go-validator
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o "../dist/jep-validate-06-${target%/*}-${target#*/}" .
          done
        working-directory: go-validator
      - run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'This version already has a release; refusing to overwrite it.'
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file RELEASE-NOTES.md dist/*
      - name: Tag the Go submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/go-validator/v$(cat VERSION)" -f "sha=$GITHUB_SHA"
  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: downloaded/
      - run: mkdir dist && cp downloaded/*.whl downloaded/*.tar.gz dist/
      - name: Publish to PyPI using the configured trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
  installed-release:
    # API 0.8.5 and Agent SDK 2.1.6 must be published before this coordinated Core release.
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-download and verify the exact published release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_registry_install.py release-install-evidence --current-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-release-${{ matrix.os }}
          path: release-install-evidence/
