name: BYOI source distribution and installed wheel
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify licensing and run BYOI outside the checkout
        run: python scripts/check_byoi_distribution.py
