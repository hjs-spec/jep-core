name: Probity Core 0.7 candidate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate-core07:
    name: Candidate Core 0.7 and pinned Probity reader
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested JEP candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out the agreed frozen suite
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hjs-spec/jep-core
          ref: a87a395b54b5685fd22d6cc86d120058f1c8850d
          path: agreed
          persist-credentials: false
      - name: Check out the separately maintained reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: probityai/agent-evidence-vectors
          ref: cbd3ea8f4de89b835d6d3c4182ff4b4b1c7608f9
          path: reader
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Retain source heads before installing dependencies
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir candidate-core07-result
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def revision(root, expression):
              return subprocess.check_output(
                  ['git', '-C', root, 'rev-parse', expression], text=True
              ).strip()

          identity = {
              'sources': {
                  root: {'head': revision(root, 'HEAD'), 'tree': revision(root, 'HEAD^{tree}')}
                  for root in ('candidate', 'agreed', 'reader')
              },
              'event': {key: os.environ.get(key) for key in (
                  'EVENT_SHA', 'PR_HEAD_SHA', 'GITHUB_REPOSITORY',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_ACTOR',
              )},
          }
          Path('candidate-core07-result/checkouts.json').write_text(
              json.dumps(identity, indent=2) + '\n'
          )
          PY
      - name: Install candidate and pinned reader dependencies
        run: |
          python -m pip install -e './candidate[test]'
          python -m pip install -r reader/interop/jep-core07-reader/requirements.txt
      - name: Run candidate checks, the pinned reader and fault controls
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python candidate/scripts/check_probity_core07_candidate.py \
            --candidate candidate --agreed agreed --reader reader \
            --output candidate-core07-result/runs
      - name: Retain both suite identities, reports, source mutations and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probity-core07-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-core07-result
          if-no-files-found: error
          retention-days: 90
