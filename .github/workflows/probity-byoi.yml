name: Probity native BYOI bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reference-validator/**'
      - 'integration/*probity*'
      - 'tests/test_byoi.py'
      - 'tests/test_probity_bridge.py'
      - 'tests/support/byoi_acceptance_fixture.py'
      - '.github/workflows/probity-byoi.yml'
  push:
    branches: [main]
    paths:
      - 'reference-validator/**'
      - 'integration/*probity*'
      - 'tests/test_byoi.py'
      - 'tests/test_probity_bridge.py'
      - 'tests/support/byoi_acceptance_fixture.py'
      - '.github/workflows/probity-byoi.yml'

permissions:
  contents: read

jobs:
  native-byoi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out the separate reader at its published pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: probityai/agent-evidence-vectors
          ref: cbd3ea8f4de89b835d6d3c4182ff4b4b1c7608f9
          path: external-reader
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install candidate tools and pinned reader dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -r external-reader/interop/jep-core07-reader/requirements.txt
      - name: Check setup failure, initial effects and diagnostic preservation
        run: python -m pytest tests/test_byoi.py tests/test_probity_bridge.py
      - name: Exercise the unchanged reader through native BYOI
        run: >-
          python integration/run_probity_byoi.py
          --reader-root external-reader
          --report probity-native-byoi-report.json
      - name: Retain scoped native report and implementation disclosure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probity-native-byoi
          path: |
            probity-native-byoi-report.json
            probity-native-byoi-report.implementation.json
          if-no-files-found: warn
          retention-days: 90
