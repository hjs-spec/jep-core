name: Current Core 0.7 interoperability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/jep-api
          ref: 14a09cdd3ee9ded13996264cb3158c3cec332f44
          path: ecosystem/jep-api
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/jep-agent-sdk
          ref: 3c203d7005ff1c5fb55591fad5019254d092e826
          path: ecosystem/jep-agent-sdk
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/sdk-go
          ref: f6712380988fcda27a07abd0d61bed0a6eb1d9ca
          path: ecosystem/sdk-go
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/Agent-Blackbox
          ref: 2950f215c74cf419506fdeae4a54670ae980a2e0
          path: ecosystem/Agent-Blackbox
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/sdk-py
          ref: 1bd6c0c40c70f2ba721b720cb310dca837874fc5
          path: ecosystem/sdk-py
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/sdk-js
          ref: 36f600aded52565a9a23af69f6991c50fbc5fa1f
          path: ecosystem/sdk-js
      - uses: actions/checkout@v4
        with:
          repository: hjs-spec/cli
          ref: 33c5053a6e24b6b940d7ccdf1919123c8ef7a4e8
          path: ecosystem/cli
      - uses: actions/checkout@v4
        with:
          repository: cognitive-emergence/tsto-spec
          ref: 91512d67f30d2efab863f1c42fe5136b6a2a795b
          path: ecosystem/tsto-spec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install verifier and client dependencies
        run: |
          pip install -e '.[test]' \
            -r ecosystem/jep-api/requirements.txt \
            -r ecosystem/tsto-spec/scripts/requirements-binding-02.txt \
            -e ecosystem/jep-agent-sdk -e ecosystem/sdk-py -e ecosystem/Agent-Blackbox -e ecosystem/cli
      - name: Recheck current CLI input boundaries
        run: python -m pytest ecosystem/cli/tests -q
      - name: Check the new-scope SDK metadata, packed import and client behavior
        run: npm test
        working-directory: ecosystem/sdk-js
      - name: Check signed artifact transport and Binding/02 references
        run: python integration/verify_current_07.py --workspace ecosystem | tee interop-07-report.json
      - name: Check common hostile-input boundaries and side-effect-free rejection
        run: python integration/input_boundaries_07.py --workspace ecosystem --report input-boundaries-07-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-07-interop-report
          path: |
            interop-07-report.json
            input-boundaries-07-report.json
