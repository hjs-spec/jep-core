[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jep-core-conformance"
version = "0.7.1"
readme = "README.md"
description = "JEP Core 0.7 conformance tools with explicit legacy 0.6 compatibility"
requires-python = ">=3.10"
dependencies = [
    "PyNaCl>=1.6.2,<2",
  "cryptography>=42",
  "rfc8785==0.1.4"
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[tool.setuptools]
packages = ["jep_conformance"]
package-dir = {jep_conformance = "reference-validator"}

[project.scripts]
jep-validate = "jep_conformance.jep_validate_07:main"
jep-validate-07 = "jep_conformance.jep_validate_07:main"
jep-validate-06 = "jep_conformance.jep_validate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
